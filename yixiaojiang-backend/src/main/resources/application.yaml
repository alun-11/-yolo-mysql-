server:
  port: 8088  # 后端端口

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ginger_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root      # 你的 MySQL 用户名
    password:  # 你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 自动驼峰转换 (db_column -> dbColumn)
  global-config:
    db-config:
      id-type: auto  # 主键自增

ai:
  python-service-url: http://localhost:8000
  model-path: ai_models/best.pt